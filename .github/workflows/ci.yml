name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Bundle is up to date
        run: npm run build && git diff --exit-code skills/answer-me/scripts/am.mjs
      - run: npm test
      - name: Render examples
        run: |
          for f in examples/*.md; do
            node bin/am.js render "$f" --no-open -o "out/$(basename "$f" .md).html"
          done
