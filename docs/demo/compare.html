<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>compare</title>
<!-- 演示动图的对比镜头。数字来自 bench/results/results.json，通过 URL 参数传入：
     ?pt=输出token&st=…&ps=秒&ss=…&n=题数&r=每题次数&model=模型名 -->
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; background: #0b0d12; font: 18px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; color: #d6dae1; }
  .wrap { width: 1080px; margin: 0 auto; }
  h1 { margin: 0; font-size: 38px; color: #fff; letter-spacing: -0.01em; }
  .sub { margin: 8px 0 40px; color: #7d8594; font-size: 17px; }
  .metric { margin-bottom: 44px; }
  .label { display: flex; justify-content: space-between; font-size: 15px; color: #9aa3b2; margin-bottom: 10px; letter-spacing: .04em; }
  .label .ratio { font-size: 20px; }
  .row { display: grid; grid-template-columns: 250px 1fr 150px; align-items: center; gap: 16px; margin: 8px 0; }
  .name { font-size: 17px; }
  .track { height: 26px; background: #161a22; border-radius: 4px; overflow: hidden; }
  .bar { height: 100%; border-radius: 4px; }
  .plain .bar { background: #4a505c; }
  .skill .bar { background: #d97757; }
  .skill .name { color: #fff; font-weight: 600; }
  .val { font: 600 19px ui-monospace, SFMono-Regular, Menlo, monospace; text-align: right; }
  .skill .val { color: #ffb08f; }
  .ratio { color: #6fd28a; font-weight: 600; }
  .foot { color: #5f6675; font-size: 14px; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Same question. Same model. One page each.</h1>
  <div class="sub" id="sub"></div>
  <div id="metrics"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const num = (k) => Number(q.get(k));
  const metrics = [
    ['Output tokens', num('pt'), num('st'), (v) => v.toLocaleString('en-US'), 'fewer'],
    ['Time', num('ps'), num('ss'), (v) => `${Math.round(v)} s`, 'faster'],
  ];
  document.getElementById('sub').textContent = `${q.get('n')} topics × ${q.get('r')} runs, medians · ${q.get('model')}`;
  document.getElementById('metrics').innerHTML = metrics.map(([label, plain, skill, fmt, word]) => `
    <div class="metric">
      <div class="label"><span>${label}</span><span class="ratio">${(plain / skill).toFixed(1)}× ${word}</span></div>
      <div class="row plain"><span class="name">Ask for HTML directly</span><div class="track"><div class="bar" style="width:100%"></div></div><span class="val">${fmt(plain)}</span></div>
      <div class="row skill"><span class="name">Answer me with HTML</span><div class="track"><div class="bar" style="width:${(skill / plain * 100).toFixed(1)}%"></div></div><span class="val">${fmt(skill)}</span></div>
    </div>`).join('');
  document.getElementById('foot').textContent = 'Measured with claude -p. Total cost per answer was about the same. Script: bench/run.mjs';
</script>
</body>
</html>
